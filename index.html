<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>متجر موسى للإلكترونيات</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
:root{
  --primary:#0F172A;
  --secondary:#F97316;
  --light:#F8FAFC;
  --text:#1E293B;
  --border:#E2E8F0;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:Tahoma,Arial;
  background:var(--light);
  color:var(--text);
  padding-bottom:90px;
}

/* ===== Header ===== */
header{
  background:var(--primary);
  color:#fff;
  position:sticky;
  top:0;
  z-index:1000;
}
.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px;
}
.menu-btn{font-size:22px;cursor:pointer}

/* ===== Mobile Menu ===== */
.mobile-menu{
  position:fixed;
  top:0;right:-260px;
  width:260px;height:100%;
  background:#fff;
  box-shadow:-4px 0 20px rgba(0,0,0,.2);
  z-index:2000;
  padding:20px;
  transition:.3s;
}
.mobile-menu.active{right:0}
.mobile-menu a{
  display:block;
  padding:14px;
  border-bottom:1px solid var(--border);
  text-decoration:none;
  color:var(--text);
  font-weight:600;
}

/* ===== Products ===== */
.products{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
  gap:15px;
  padding:15px;
}
.card{
  background:#fff;
  border-radius:14px;
  padding:10px;
  box-shadow:0 4px 14px rgba(0,0,0,.08);
}
.card img{
  width:100%;
  height:120px;
  object-fit:contain;
}
.card h4{
  font-size:14px;
  margin:8px 0;
  height:38px;
  overflow:hidden;
}
.price{
  color:var(--secondary);
  font-weight:bold;
}
.card button{
  width:100%;
  margin-top:8px;
  padding:8px;
  border:none;
  border-radius:10px;
  background:var(--secondary);
  color:#fff;
  font-weight:bold;
  cursor:pointer;
}

/* ===== Cart Bar ===== */
.cart-bar{
  position:fixed;
  bottom:0;left:0;right:0;
  background:#fff;
  border-top:3px solid var(--secondary);
  padding:10px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.cart-btn{
  background:var(--secondary);
  color:#fff;
  border:none;
  padding:10px 16px;
  border-radius:12px;
  font-weight:bold;
}

/* ===== Modal ===== */
.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.7);
  z-index:3000;
  align-items:center;
  justify-content:center;
}
.modal-content{
  background:#fff;
  width:95%;
  max-width:420px;
  border-radius:18px;
  padding:20px;
  max-height:90vh;
  overflow:auto;
}
.modal-content input{
  width:100%;
  padding:10px;
  margin:8px 0;
}
</style>
</head>

<body>

<header>
  <div class="header">
    <strong>متجر موسى</strong>
    <i class="fas fa-bars menu-btn" onclick="toggleMenu()"></i>
  </div>
</header>

<div class="mobile-menu" id="mobileMenu">
  <a href="#">🏠 الرئيسية</a>
  <a href="#">📦 المنتجات</a>
  <a href="#">ℹ️ من نحن</a>
  <a href="#" onclick="openCart()">🛒 السلة</a>
  <a href="#" onclick="toggleMenu()">❌ إغلاق</a>
</div>

<div class="products" id="products"></div>

<div class="cart-bar">
  <span id="cartInfo">0 د.ع</span>
  <button class="cart-btn" onclick="openCart()">إتمام الطلب</button>
</div>

<div class="modal" id="cartModal">
  <div class="modal-content">
    <h3>سلة التسوق</h3>
    <div id="cartItems"></div>

    <input id="custName" placeholder="الاسم">
    <input id="custAddress" placeholder="العنوان">

    <button class="cart-btn" onclick="printPDF()">🧾 طباعة PDF</button>
    <button class="cart-btn" style="background:#ccc;color:#000;margin-top:8px" onclick="closeCart()">إغلاق</button>
  </div>
</div>

<script>
const { jsPDF } = window.jspdf;

/* ===== 35 Product ===== */
const products=[
{id:1,name:"iPhone 15 Pro Max",price:1850000,img:"https://images.unsplash.com/photo-1695048133142-1a20484d2569?w=400"},

{id:4,name:"Galaxy S23 FE",price:780000,img:"https://images.unsplash.com/photo-1610945265064-0e34e5519bbf?w=400"},
{id:5,name:"Apple Watch 9",price:520000,img:"https://images.unsplash.com/photo-1579586337278-3befd40fd17a?w=400"},
{id:6,name:"AirPods Pro 2",price:310000,img:"https://images.unsplash.com/photo-1600294037681-c80b4cb5b434?w=400"},

{id:8,name:"iPad Pro M2",price:1250000,img:"https://images.unsplash.com/photo-1544244015-0df4b3ffc6b0?w=400"},
{id:9,name:"PlayStation 5",price:850000,img:"https://images.unsplash.com/photo-1606144042614-b2417e99c4e3?w=400"},
{id:10,name:"Xbox Series X",price:780000,img:"https://images.unsplash.com/photo-1605901309584-818e25960a8f?w=400"},
{id:11,name:"Nintendo Switch OLED",price:650000,img:"https://images.unsplash.com/photo-1550745165-9bc0b252726f?w=400"},
{id:12,name:"JBL Flip 6",price:95000,img:"https://images.unsplash.com/photo-1605464315542-bda3e2f4c6c6?w=400"},
{id:13,name:"Sony XM5",price:385000,img:"https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=400"},
{id:14,name:"Power Bank Anker",price:55000,img:"https://images.unsplash.com/photo-1609592424089-9890374108e7?w=400"},

{id:27,name:"External HDD",price:95000,img:"https://images.unsplash.com/photo-1593640495253-23196b27a87f?w=400"},
{id:28,name:"Smart TV 55\"",price:980000,img:"https://images.unsplash.com/photo-1593359677879-a4bb92f829d1?w=400"},
{id:29,name:"Drone Camera",price:1350000,img:"https://images.unsplash.com/photo-1508614999368-9260051292e5?w=400"},
{id:30,name:"Action Camera",price:420000,img:"https://images.unsplash.com/photo-1526170375885-4d8ecf77b99f?w=400"},
{id:31,name:"Car Charger",price:18000,img:"https://images.unsplash.com/photo-1583863788434-e58a36330cf0?w=400"},
{id:32,name:"Headset Gaming",price:65000,img:"https://images.unsplash.com/photo-1599669454699-248893623440?w=400"},
{id:33,name:"Smart Watch Generic",price:85000,img:"https://images.unsplash.com/photo-1546868871-7041f2a55e12?w=400"},
{id:34,name:"Tablet Android",price:320000,img:"https://images.unsplash.com/photo-1561154463-57b5c3a38d04?w=400"},
{id:35,name:"Laptop Bag",price:45000,img:"https://images.unsplash.com/photo-1585386959984-a41552231693?w=400"}
];

let cart=[];

/* Render Products */
const box=document.getElementById("products");
products.forEach(p=>{
  box.innerHTML+=`
  <div class="card">
    <img src="${p.img}">
    <h4>${p.name}</h4>
    <div class="price">${p.price.toLocaleString()} د.ع</div>
    <button onclick="add(${p.id})">أضف للسلة</button>
  </div>`;
});

/* Cart */
function add(id){
  cart.push(products.find(p=>p.id===id));
  updateCart();
}
function updateCart(){
  document.getElementById("cartInfo").innerText=
  cart.reduce((s,i)=>s+i.price,0).toLocaleString()+" د.ع";
}
function openCart(){
  document.getElementById("cartModal").style.display="flex";
  document.getElementById("cartItems").innerHTML=
  cart.map(i=>`• ${i.name} - ${i.price.toLocaleString()} د.ع`).join("<br>");
}
function closeCart(){
  document.getElementById("cartModal").style.display="none";
}

/* PDF */
function printPDF(){
  const doc=new jsPDF();
  doc.text("فاتورة - متجر موسى",10,10);
  cart.forEach((i,idx)=>{
    doc.text(`${i.name} - ${i.price.toLocaleString()} د.ع`,10,20+idx*8);
  });
  doc.save("order.pdf");
}

/* Menu */
function toggleMenu(){
  document.getElementById("mobileMenu").classList.toggle("active");
}
</script>

</body>
</html>
