<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>متجر موسى للإلكترونيات</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
/* ================== VARIABLES ================== */
:root{
  --primary:#1a56db;
  --accent:#10b981;
  --danger:#ef4444;
  --bg:#f8fafc;
  --card:#ffffff;
  --text:#1f2937;
  --muted:#6b7280;
  --radius:12px;
  --shadow:0 6px 20px rgba(0,0,0,.08);
}

/* ================== RESET ================== */
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:system-ui,-apple-system;
  background:var(--bg);
  color:var(--text);
  padding-bottom:90px;
}

/* ================== HEADER ================== */
header{
  position:sticky;
  top:0;
  background:var(--card);
  box-shadow:var(--shadow);
  z-index:100;
}
.header{
  max-width:1200px;
  margin:auto;
  padding:12px 16px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.logo{
  display:flex;
  align-items:center;
  gap:10px;
}
.logo i{
  background:linear-gradient(135deg,var(--primary),var(--accent));
  color:#fff;
  padding:10px;
  border-radius:10px;
}
.logo span{
  font-weight:800;
  font-size:1.1rem;
}
.cart-btn{
  position:relative;
  background:#f1f5f9;
  padding:10px 14px;
  border-radius:10px;
  cursor:pointer;
}
.cart-count{
  position:absolute;
  top:-6px;
  left:-6px;
  background:var(--danger);
  color:#fff;
  font-size:.7rem;
  width:20px;
  height:20px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
}

/* ================== HERO ================== */
.hero{
  background:linear-gradient(135deg,#1a56db,#1e40af);
  color:#fff;
  text-align:center;
  padding:50px 16px;
}
.hero h1{font-size:1.8rem;margin-bottom:10px}
.hero p{opacity:.9}

/* ================== PRODUCTS ================== */
.products{
  max-width:1200px;
  margin:auto;
  padding:40px 16px;
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
  gap:20px;
}
.product{
  background:var(--card);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  overflow:hidden;
}
.product img{
  width:100%;
  height:180px;
  object-fit:contain;
  background:#f1f5f9;
  padding:20px;
}
.product-body{
  padding:16px;
}
.product h3{
  font-size:1rem;
  margin-bottom:6px;
}
.product p{
  font-size:.85rem;
  color:var(--muted);
  margin-bottom:10px;
}
.price{
  font-weight:800;
  color:var(--primary);
  margin-bottom:12px;
}
.product button{
  width:100%;
  border:none;
  padding:12px;
  border-radius:10px;
  background:var(--primary);
  color:#fff;
  font-weight:700;
  cursor:pointer;
}
.product button.added{
  background:var(--accent);
}

/* ================== CART FOOTER ================== */
.cart-footer{
  position:fixed;
  bottom:0;
  right:0;
  left:0;
  background:var(--card);
  box-shadow:0 -6px 20px rgba(0,0,0,.15);
  padding:12px 16px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  transition:.3s;
}
.cart-footer.hidden{transform:translateY(100%)}
.cart-footer strong{color:var(--primary)}
.cart-footer button{
  background:var(--accent);
  border:none;
  padding:12px 24px;
  border-radius:10px;
  color:#fff;
  font-weight:800;
  cursor:pointer;
}

/* ================== MODAL ================== */
.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.85);
  z-index:1000;
  justify-content:center;
  align-items:center;
  padding:16px;
}
.modal-content{
  background:#fff;
  width:100%;
  max-width:500px;
  border-radius:16px;
  overflow:hidden;
}
.modal-header{
  background:var(--primary);
  color:#fff;
  padding:16px;
  display:flex;
  justify-content:space-between;
}
.modal-body{padding:20px;max-height:65vh;overflow:auto}
.cart-item{
  display:flex;
  justify-content:space-between;
  margin-bottom:14px;
}
.cart-item small{color:var(--muted)}
.modal-footer{
  padding:16px;
  display:flex;
  gap:10px;
}
.modal-footer button{
  flex:1;
  padding:12px;
  border:none;
  border-radius:10px;
  font-weight:700;
}
.btn-secondary{background:#e5e7eb}
.btn-success{background:var(--accent);color:#fff}

/* ================== FOOTER ================== */
footer{
  background:#111827;
  color:#d1d5db;
  padding:40px 16px;
  text-align:center;
  margin-top:40px;
}
footer p{margin:6px 0;font-size:.9rem}
</style>
</head>

<body>

<header>
  <div class="header">
    <div class="logo">
      <i class="fa-solid fa-store"></i>
      <span>متجر موسى</span>
    </div>
    <div class="cart-btn" onclick="openCart()">
      <i class="fa-solid fa-cart-shopping"></i>
      <div class="cart-count" id="cartCount">0</div>
    </div>
  </div>
</header>

<section class="hero">
  <h1>أفضل الإلكترونيات الأصلية</h1>
  <p>توصيل داخل بغداد | فحص قبل الدفع | دفع عند الاستلام</p>
</section>

<section class="products" id="products"></section>

<div class="cart-footer" id="cartFooter">
  <strong>المجموع: <span id="total">0</span> د.ع</strong>
  <button onclick="openCart()">إتمام الطلب</button>
</div>

<!-- CART MODAL -->
<div class="modal" id="cartModal">
  <div class="modal-content">
    <div class="modal-header">
      <span>سلة الطلب</span>
      <span style="cursor:pointer" onclick="closeCart()">✕</span>
    </div>
    <div class="modal-body" id="cartItems"></div>
    <div class="modal-footer">
      <button class="btn-secondary" onclick="printInvoice()">طباعة فاتورة</button>
      <button class="btn-success" onclick="sendWhatsApp()">إرسال واتساب</button>
    </div>
  </div>
</div>

<footer>
  <p>📞 07717538315</p>
  <p>📍 بغداد – الكرادة</p>
  <p>✉️ mousasaleh2024@gmail.com</p>
  <p>© 2024 متجر موسى</p>
</footer>

<script>
const products=[
 {id:1,name:"Apple Watch 9",price:520000,img:"https://images.unsplash.com/photo-1579586337278-3befd40fd17a?w=500"},
 {id:2,name:"Galaxy Watch 6",price:285000,img:"https://images.unsplash.com/photo-1610671914904-5d97d759cd7a?w=500"},
 {id:3,name:"AirPods Pro 2",price:310000,img:"https://images.unsplash.com/photo-1600297526837-3437097a7318?w=500"},
 {id:4,name:"Power Bank Anker",price:55000,img:"https://images.unsplash.com/photo-1609592424089-9890374108e7?w=500"}
];

let cart=JSON.parse(localStorage.getItem("cart"))||{};

const productsDiv=document.getElementById("products");

function renderProducts(){
 productsDiv.innerHTML="";
 products.forEach(p=>{
  const inCart=cart[p.id];
  productsDiv.innerHTML+=`
   <div class="product">
    <img src="${p.img}">
    <div class="product-body">
     <h3>${p.name}</h3>
     <p>منتج أصلي مضمون</p>
     <div class="price">${p.price.toLocaleString()} د.ع</div>
     <button class="${inCart?"added":""}" onclick="addToCart(${p.id})">
      ${inCart?"تمت الإضافة":"أضف للطلب"}
     </button>
    </div>
   </div>`;
 });
}

function addToCart(id){
 if(!cart[id]) cart[id]={...products.find(p=>p.id===id),qty:1};
 else cart[id].qty++;
 save();
 if(Object.keys(cart).length===1) openCart();
}

function save(){
 localStorage.setItem("cart",JSON.stringify(cart));
 updateUI();
 renderProducts();
}

function updateUI(){
 let count=0,total=0;
 Object.values(cart).forEach(i=>{
  count+=i.qty;
  total+=i.qty*i.price;
 });
 document.getElementById("cartCount").textContent=count;
 document.getElementById("total").textContent=total.toLocaleString();
 document.getElementById("cartFooter").style.display=count? "flex":"none";
}

function openCart(){
 const modal=document.getElementById("cartModal");
 const items=document.getElementById("cartItems");
 items.innerHTML="";
 Object.values(cart).forEach(i=>{
  items.innerHTML+=`
   <div class="cart-item">
    <div>
     <strong>${i.name}</strong>
     <small>${i.qty} × ${i.price.toLocaleString()}</small>
    </div>
    <strong>${(i.qty*i.price).toLocaleString()}</strong>
   </div>`;
 });
 modal.style.display="flex";
}

function closeCart(){
 document.getElementById("cartModal").style.display="none";
}

function sendWhatsApp(){
 let msg="السلام عليكم متجر موسى 👋\n\n🛒 الطلب:\n";
 let total=0;
 Object.values(cart).forEach(i=>{
  msg+=`- ${i.name} × ${i.qty}\n`;
  total+=i.qty*i.price;
 });
 msg+=`\n💰 المجموع: ${total.toLocaleString()} د.ع\n`;
 msg+=`💳 الدفع عند الاستلام\n📍 بغداد`;
 window.open(`https://wa.me/9647717538315?text=${encodeURIComponent(msg)}`);
 cart={};
 save();
 closeCart();
}

function printInvoice(){
 let w=window.open("");
 let html="<h2>فاتورة متجر موسى</h2><hr>";
 let total=0;
 Object.values(cart).forEach(i=>{
  html+=`<p>${i.name} × ${i.qty}</p>`;
  total+=i.qty*i.price;
 });
 html+=`<hr><strong>المجموع: ${total.toLocaleString()} د.ع</strong>`;
 w.document.write(html);
 w.print();
 w.close();
}

let lastY=0;
window.addEventListener("scroll",()=>{
 const f=document.getElementById("cartFooter");
 if(scrollY>lastY) f.classList.add("hidden");
 else f.classList.remove("hidden");
 lastY=scrollY;
});

renderProducts();
updateUI();
</script>

</body>
</html>
